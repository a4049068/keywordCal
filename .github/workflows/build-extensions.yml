name: Build Thunderbird Extensions

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests
        run: |
          python - <<'PY'
          import json, pathlib
          for path in [pathlib.Path('keywordcal/manifest.json'), pathlib.Path('calendar-bridge/manifest.json')]:
              with path.open() as f:
                  json.load(f)
          print('manifest ok')
          PY

      - name: Build extension packages
        run: |
          mkdir -p dist
          (cd keywordcal && zip -qr ../dist/keywordcal.xpi .)
          (cd calendar-bridge && zip -qr ../dist/calendar-bridge.xpi .)
          ls -l dist

      - name: Upload as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thunderbird-extensions
          path: dist/*.xpi
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/keywordcal.xpi
            dist/calendar-bridge.xpi
