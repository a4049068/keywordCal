name: Build Thunderbird Extensions

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests
        run: |
          python - <<'PY'
          import json, pathlib
          for path in [pathlib.Path('keywordcal/manifest.json'), pathlib.Path('calendar-bridge/manifest.json')]:
              with path.open() as f:
                  json.load(f)
          print('manifest ok')
          PY

      - name: Build extension packages
        run: |
          mkdir -p dist
          zip -jr dist/keywordcal.xpi keywordcal
          zip -jr dist/calendar-bridge.xpi calendar-bridge

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thunderbird-extensions
          path: dist/*.xpi
